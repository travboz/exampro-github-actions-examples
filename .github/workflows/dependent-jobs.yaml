name: "Running jobs in a sequence: needs/dependencies"
run-name: ${{ github.actor }} is sequencing jobs to run in an order

on:
  push:
    branches:
      - main

jobs:
  job2:
    runs-on: ubuntu-latest
    needs: job1

    steps:
      - name: stepB
        run: |
          echo ", World!"

  job1:
    runs-on: ubuntu-latest

    steps:
      - name: stepA
        run: |
          echo "Hello"
