name: Webhook Event example

on:
  repository_dispatch:

jobs:
  respond-to-dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Print out the event type that triggered the workflow
        run: |
          echo "Event type trigger: $GITHUB_EVENT_NAME"
